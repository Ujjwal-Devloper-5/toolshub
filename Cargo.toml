[workspace]
members = [
    "crates/toolshub-core",
    "crates/toolshub-env",
    "crates/toolshub-memory",
    "crates/toolshub-ai",
    "crates/toolshub-package",
    "crates/toolshub-doc",
    "crates/toolshub-context",
    "crates/toolshub-safety",
    "crates/toolshub-tui",
    "crates/toolshub-cli",
]
resolver = "2"

[workspace.package]
version       = "0.1.0"
edition       = "2021"
authors       = ["ToolsHub Contributors"]
license       = "Apache-2.0"
repository    = "https://github.com/Ujjwal-Devloper-5/toolshub"
homepage      = "https://github.com/Ujjwal-Devloper-5/toolshub"
documentation = "https://github.com/Ujjwal-Devloper-5/toolshub"
keywords      = ["cli", "ai", "package-manager", "terminal", "tools"]
categories    = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# ── Async runtime ──────────────────────────────────────────────
tokio            = { version = "1",    features = ["full"] }

# ── CLI / TUI ──────────────────────────────────────────────────
clap             = { version = "4",    features = ["derive", "env", "color", "wrap_help"] }
ratatui          = { version = "0.27" }
crossterm        = { version = "0.27" }

# ── Serialisation ──────────────────────────────────────────────
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"
toml             = "0.8"

# ── Database ───────────────────────────────────────────────────
sqlx             = { version = "0.8",  features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }

# ── HTTP ───────────────────────────────────────────────────────
reqwest          = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# ── Error handling ─────────────────────────────────────────────
anyhow           = "1"
thiserror        = "2"

# ── Logging / tracing ──────────────────────────────────────────
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ── Utilities ──────────────────────────────────────────────────
chrono           = { version = "0.4",  features = ["serde"] }
dirs             = "5"
uuid             = { version = "1",    features = ["v4", "serde"] }
regex            = "1"
which            = "6"
semver           = { version = "1",    features = ["serde"] }
async-trait      = "0.1"
futures          = "0.3"
once_cell        = "1"
strum            = { version = "0.26", features = ["derive"] }
strum_macros     = "0.26"
colored          = "2"
indicatif        = "0.17"
dialoguer        = "0.11"
console          = "0.15"
textwrap         = "0.16"
shellexpand      = "3"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true
